; =============================================================================
; Street Riders v1.3.0 — Advanced Tuning
; =============================================================================
; This file controls wheelie physics, driving behavior, remount, and police.
; Most users don't need to touch this — edit StreetRiders.ini for groups and general settings.
;
; Reload at any time in-game with your ReloadKey (default: F10).
; =============================================================================

; =============================================================================
; WHEELIE CONFIG (default for all bikes)
; =============================================================================
;
; HOW IT WORKS:
;   Smooth continuous force applied every frame.
;   Force is automatically dampened by pitch velocity (angular damping),
;   so the bike can't overshoot and oscillate.
;
; PITCH CONTROL:
;   0..50% of TargetPitch  -> full lift force (dampened by rise speed)
;   50%..TargetPitch       -> force fades out progressively + velocity damping
;   TargetPitch..MaxPitch  -> coast zone (no force, gravity settles naturally)
;   Above MaxPitch         -> gentle correction pushes the front back down
;
; TUNING TIPS:
;   - Bike lifts too hard?   Lower LiftForce
;   - Bike doesn't lift?     Raise LiftForce
;   - Wheelie angle too high? Lower TargetPitch
;   - Bike flips over?       Lower MaxPitch
;   - Wheelie still bouncy?  Lower LiftForce and raise TorqueOffset
;
; =============================================================================

[DefaultWheelie]

; --- CORE ---
LiftForce = 0.18
TorqueOffset = 1.2
PulseIntervalMs = 0
MinSpeed = 12.0

; --- PITCH CONTROL ---
TargetPitch = 40.0
MaxPitch = 43.0

; --- TIMING ---
AttemptDurationMin = 3000
AttemptDurationMax = 5000
SustainDurationMin = 5000
SustainDurationMax = 20000
AttemptDelayMin = 1000
AttemptDelayMax = 5000
AttemptsMin = 1
AttemptsMax = 4
; Cooldown (ms) between stunt animations within the same Sustained phase
StuntCooldown = 8000
; Stunt animations played during Sustained wheelies.
; Format: dict:clip, dict:clip, ...  (comma-separated, one or more dictionaries)
; Default uses the rcmextreme2atv ATV stunt dict — replace or add entries freely.
;
; NOTE: Full-body animations (75% of triggers) replace the rider's driving task for their
; duration. During this window the rider has no active navigation and may collide with
; obstacles — especially walls, poles, and parked cars. A forward raycast (RaycastDistance)
; tries to cancel stunts before an obstacle is hit, but GTA's collision geometry is complex
; and the raycast won't catch everything. This is a known engine-level limitation.
; Reduce StuntCooldown / increase RaycastDistance to lower risk, or use StuntAnimations
; with only upper-body clips and flag them accordingly in your animation dict.
StuntAnimations = rcmextreme2atv:idle_b, rcmextreme2atv:idle_c, rcmextreme2atv:idle_d, rcmextreme2atv:idle_e

; --- SAFETY ---
RaycastDistance = 10.0
MaxSteeringAngle = 12.0
BrakeThreshold = 0.5

; --- DRIVING ---
DriveSpeed = 15.0
MaxEntitySpeed = 20.0
DriveAbility = 0.8
DriveAggressiveness = 0.5
; Flags breakdown: AvoidVehicles(4) | SteerAroundStationary(8) | AvoidPeds(16) | AvoidObjects(32)
;   | AdjustCruiseSpeed(16384) | UseShortcutLinks(262144) | ChangeLanes(524288) | Overtake(65536)
; Interactive calculator: https://vespura.com/fivem/drivingstyle/
DrivingFlags = 868413

; --- PED BEHAVIOR ---
BlockNonTempEvents = false
FleeAttributes = 0
CombatAttribute = 5
CombatAttributeValue = false

; --- REMOUNT ---
RemountEnterDistance = 8.0
RemountMaxDistance = 100.0
RemountMoveSpeed = 3.0
RemountTimeout = 15000
RemountTaskCooldown = 3000
RemountForceTimeout = 10000

; --- POLICE ---
; AllowPoliceArrest: cops chase riders actively doing a wheelie (Phase.Sustained only)
AllowPoliceArrest = false
PolicePursuitRadius = 100.0
PolicePursuitMinDuration = 60000

; =============================================================================
; CUSTOM PER-BIKE CONFIGURATION
; =============================================================================
; Override [DefaultWheelie] settings for specific bike models.
; Only the settings you include will be overridden — everything else uses defaults.
;
; To use an override:
;   1. Add the model name to BikeOverrides in StreetRiders.ini (e.g. BikeOverrides = SANCHEZ2, BF400)
;   2. Create a [Bike_MODELNAME] section below
;
; Also works with addon bikes — use [Bike_ADDONNAME] with the addon's spawn name.
; =============================================================================

[Bike_SANCHEZ2]
LiftForce = 0.32
TargetPitch = 50.0
MaxPitch = 55.0

[Bike_BF400]
LiftForce = 0.15
TargetPitch = 45.0
MaxPitch = 50.0

; --- Add more overrides below ---
