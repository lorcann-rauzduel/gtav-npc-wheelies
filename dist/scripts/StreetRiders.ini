; =============================================================================
; Street Riders v1.1.0 - Realistic NPC Wheelies for GTA V
; =============================================================================
; Reload at any time with the ReloadKey (default: F10)
; =============================================================================

[General]
Enabled = true
Debug = false
DebugKey = Insert
ReloadKey = F10

; === Spawn Settings ===
SpawnDistanceMin = 120.0
SpawnDistanceMax = 150.0
CleanupDistance = 250.0
MaxActiveGroups = 1
RidersPerGroupMin = 2
RidersPerGroupMax = 4
SpawnIntervalMs = 15000
SpawnSpacing = 5.0

; WheelieActiveDistance: wheelie physics only run when player is within this range (m).
; Riders further away just cruise normally. Saves performance.
;   50 = close only | 80 = normal | 150 = wide
WheelieActiveDistance = 200.0
DestinationDistanceMin = 300.0
DestinationDistanceMax = 700.0

; Default active hours (used if a group doesn't set its own)
DefaultActiveHourStart = 0
DefaultActiveHourEnd = 23

; Also apply wheelie AI to natural NPC bikers in traffic
ApplyToNaturalRiders = false
NaturalRiderScanRadius = 200.0

; Bike models excluded from wheelie (comma-separated, case-insensitive)
; These bikes will never attempt wheelies even if DoWheelie = true
WheelieExcludedModels = BMX, CRUISER, TRIBIKE, TRIBIKE2, TRIBIKE3, SCORCHER, POLICEB

; Bike models with custom wheelie configs (needs [Bike_XXX] sections at the bottom)
; If a bike is listed here, it uses its own [Bike_XXX] section instead of [DefaultWheelie]
; Example: BikeOverrides = SANCHEZ, BF400 -> uses [Bike_SANCHEZ] and [Bike_BF400]
BikeOverrides = SANCHEZ2, BF400

; Rider groups (needs [Group_XXX] sections below)
Groups = Families, Ballas, Vagos, Salva, Default

; =============================================================================
; TEST MODE
; =============================================================================
; NumPad1 = Force spawn near you | NumPad0 = Clean all

[TestMode]
Enabled = false
ForceSpawnKey = NumPad1
CleanAllKey = NumPad0

; =============================================================================
; FOLLOW PLAYER
; =============================================================================
; Riders with CanFollowPlayer = true can follow your vehicle.
; Toggle manually with ToggleKey, or let it trigger automatically.
; =============================================================================

[FollowPlayer]
Enabled = true
ToggleKey = F7

; Mode: Proximity = follow when player is nearby (any rider in group)
;        Dynamic  = speed-based:
;           Player fast (> DynamicMinSpeed) + close (< FollowRadius) = player takes lead
;           Player slow (< DynamicMinSpeed) = riders take back lead
;           Player too far (> LoseRadius) = riders take back lead
Mode = Dynamic

; FollowRadius: Trigger distance (m) — if ANY rider is within this range, group follows
;   40 = close | 60 = normal | 100 = wide
FollowRadius = 60.0

; LoseRadius: Cancel distance (m) — if ALL riders are further than this, group stops following
;   100 = tight | 150 = normal | 200 = relaxed | 300 = very sticky
LoseRadius = 200.0

; Minimum player speed for Dynamic mode (m/s) — below this, riders take back the lead
DynamicMinSpeed = 12.0

; How long (ms) the player must maintain speed above DynamicMinSpeed before triggering follow
; Prevents brief acceleration from triggering follow mode
DynamicTriggerMs = 2000

; What vehicle the player must be in: Any | BikeOnly | TwoWheeler
PlayerVehicleType = Any

; When player dismounts:
;   Wait      = riders dismount, walk to player, play idle scenarios
;   Continue  = random leader takes over the group
;   Freestyle = riders stay on bikes, ride loops and do wheelies near the player
DismountBehavior = Wait

; Scenarios riders play when waiting (comma-separated WORLD_HUMAN_* names)
IdleScenarios = WORLD_HUMAN_SMOKING, WORLD_HUMAN_STAND_MOBILE

; Delay before riders dismount and start idle scenarios (ms)
IdleDelayMs = 8000

; Delay after player remounts before riders resume following (ms)
ResumeDelayMs = 3000

; Distance from player at which riders start playing idle scenarios (meters)
IdleScenarioDistance = 8.0

; Distance from player at which riders stop scenarios and follow on foot (meters)
IdleFollowDistance = 15.0

; Minimum distance riders stay near the player on foot (meters)
IdleMinStayDistance = 6.0

; Time (ms) a rider waits near the player before starting a scenario
IdleScenarioWaitMs = 4000

; Minimum follow distance (meters) for TASK_VEHICLE_FOLLOW when escorting player
;   10 = tight | 15 = normal | 25 = relaxed
FollowMinDistance = 15

; === Bodyguard Mode (WORK IN PROGRESS — DO NOT ENABLE) ===
; This feature is still under development. Enabling it may cause riders to
; attack each other or the player. It will be properly released in a future update.
BodyguardEnabled = false

; Radius (meters) to detect attackers
BodyguardRadius = 30.0

; Max duration (ms) of bodyguard engagement before resuming normal behavior
BodyguardDurationMs = 15000

; =============================================================================
; WHEELIE CONFIG (default for all bikes, override per-bike with [Bike_XXX])
; =============================================================================
;
; HOW IT WORKS:
;   Smooth continuous force applied every frame.
;   Force is automatically dampened by pitch velocity (angular damping),
;   so the bike can't overshoot and oscillate.
;
; PITCH CONTROL:
;   0..50% of TargetPitch  -> full lift force (dampened by rise speed)
;   50%..TargetPitch       -> force fades out progressively + velocity damping
;   TargetPitch..MaxPitch  -> coast zone (no force, gravity settles naturally)
;   Above MaxPitch         -> gentle correction pushes the front back down
;
; TUNING TIPS:
;   - Bike lifts too hard? Lower LiftForce.
;   - Bike doesn't lift? Raise LiftForce.
;   - Wheelie angle too high? Lower TargetPitch.
;   - Bike flips over? Lower MaxPitch.
;   - Wheelie still bouncy? Lower LiftForce and raise TorqueOffset.
;
; =============================================================================

[DefaultWheelie]

; --- CORE ---
LiftForce = 0.18
TorqueOffset = 1.2
PulseIntervalMs = 0
MinSpeed = 12.0

; --- PITCH CONTROL ---
TargetPitch = 40.0
MaxPitch = 43.0

; --- TIMING ---
AttemptDurationMin = 3000
AttemptDurationMax = 5000
SustainDurationMin = 5000
SustainDurationMax = 20000
AttemptDelayMin = 1000
AttemptDelayMax = 5000
AttemptsMin = 1
AttemptsMax = 4

; --- SAFETY ---
RaycastDistance = 6.0
MaxSteeringAngle = 8.0
BrakeThreshold = 0.5

; --- DRIVING ---
DriveSpeed = 20.0
MaxEntitySpeed = 25.0
DriveAbility = 1.0
DriveAggressiveness = 1.0
DrivingFlags = 786468

; --- PED BEHAVIOR ---
BlockNonTempEvents = true
FleeAttributes = 0
CombatAttribute = 17
CombatAttributeValue = true
SuffersCriticalHits = -1

; --- REMOUNT ---
RemountEnterDistance = 8.0
RemountMaxDistance = 100.0 ; if rider is too far from bike, he will wander in the street
RemountMoveSpeed = 3.0
RemountTimeout = 15000
RemountTaskCooldown = 3000
RemountForceTimeout = 20000    ; ms before force-warping rider onto bike (0 = disabled, but sometimes rider will not remount for some reason, i work on it)

; --- POLICE ---
AllowPoliceArrest = false
PolicePursuitRadius = 100.0
PolicePursuitMinDuration = 15000

; =============================================================================
; RIDER GROUPS
; =============================================================================
; Zones = GTA V zone names (empty = spawns everywhere)
;   CHAMH=Chamberlain  DAVIS=Davis    STRAW=Strawberry  RANCHO=Rancho
;   LMESA=La Mesa      CYPRE=Cypress  EBURO=El Burro    MURRI=Murrieta
;   SANDY=Sandy Shores GRAPES=Grapeseed PALETO=Paleto   KOREAT=Little Seoul
;
; BikeModels: comma-separated GTA V motorcycle model names.
;   Use the internal spawn name (case-insensitive).
;   ADDON BIKES: Should work if installed correctly via a dlcpacks mod loader
;   (e.g. OpenIV). Just use the addon's spawn name like any vanilla bike.
;   Example: BikeModels = BF400, my_custom_bike
;   Note: Addon compatibility is not guaranteed — if a model fails to load,
;   the rider using it will simply not spawn.
;
;   Common vanilla motorcycles:
;
;   SPORT/STREET:
;     BATI       Pegassi Bati 801         BATI2      Pegassi Bati 801RR
;     AKUMA      Dinka Akuma              CARBONRS   Nagasaki Carbon RS
;     DOUBLE     Dinka Double-T           HAKUCHOU   Shitzu Hakuchou
;     NEMESIS    Principe Nemesis         PCJ        Shitzu PCJ 600
;     RUFFIAN    Pegassi Ruffian          LECTRO     Pegassi Lectro
;     DIABLOUS   Principe Diabolus
;
;   OFF-ROAD/DIRT:
;     SANCHEZ    Nagasaki Sanchez (livery) SANCHEZ2  Nagasaki Sanchez (plain)
;     BF400      Nagasaki BF400           MANCHEZ    Maibatsu Manchez
;     ENDURO     Dinka Enduro             CLIFFHANGER Western Cliffhanger
;     GARGOYLE   Western Gargoyle
;
;   CRUISER/CHOPPER:
;     DAEMON     Western Daemon           HEXER      LCC Hexer
;     INNOVATION Western LCC Innovation   WOLFSBANE  Western Wolfsbane
;     ZOMBIEA    Western Zombie Bobber    ZOMBIEB    Western Zombie Chopper
;     RATBIKE    Western Ratbike          CHIMERA    Nagasaki Chimera
;
;   Full list: https://wiki.gtanet.work/index.php/Motorcycles
;
; MixedVehicles: true = each rider gets a different bike from BikeModels list
;   (round-robin: rider1=BF400, rider2=SANCHEZ2, rider3=BF400...)
;   false = all riders in the group ride the same randomly-picked model
;
; BikeColors: comma-separated GTA V paint color IDs (empty = game default random)
;   0=Black 12=Red 27=Blue 38=Green 88=Yellow 120=Purple 135=White
;   Full list: https://wiki.rage.mp/index.php?title=Vehicle_Colors
;
; Weapons: (OPTIONAL) comma-separated weapon names. Leave empty for unarmed riders.
;   WARNING: Armed riders may enter combat with other NPCs, which can interrupt
;   their riding behavior. Use at your own risk — this feature is being improved.
;   Common weapons: WEAPON_PISTOL, WEAPON_COMBATPISTOL, WEAPON_APPISTOL,
;                   WEAPON_MICROSMG, WEAPON_SMG, WEAPON_MACHINEPISTOL
;
; CanFollowPlayer: true = this group can follow the player's vehicle
; =============================================================================

[Group_Families]
