; =============================================================================
; CUSTOM PER-BIKE CONFIGURATION
; =============================================================================
; Override [DefaultWheelie] settings for specific bike models.
; Create a section named [Bike_MODELNAME] where MODELNAME matches the spawn name.
; Only the settings you include will be overridden — everything else uses defaults.
; Also works with addon bikes — use [Bike_ADDONNAME] with the addon's spawn name.
;
; To use an override:
;   1. Add the model name to BikeOverrides in [General] (e.g. BikeOverrides = SANCHEZ, BF400)
;   2. Create a [Bike_MODELNAME] section below
;
; Example: The SANCHEZ is a dirt bike — it gets more aggressive wheelie settings
; and slightly slower drive speed since it's lighter and lifts easier.
; =============================================================================

[Bike_SANCHEZ2]
LiftForce = 0.32          
TargetPitch = 50.0         ; Higher angle (default 40) — dirt bikes can go higher
MaxPitch = 55.0

[Bike_BF400]
; ; BF400 — needs less lift force
LiftForce = 0.15          
TargetPitch = 45.0
MaxPitch = 50.0

