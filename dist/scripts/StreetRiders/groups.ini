; =============================================================================
; Street Riders v2.0.0 — Rider Groups
; =============================================================================
; Define which crews spawn, where, and when.
; Reload in-game with ReloadKey (default: F10).
; =============================================================================

[General]
; Active groups — add or remove names here. Each name needs a [Group_NAME] section below.
Groups = Families, Ballas, Vagos, Salva, Default

; === Default values for groups that don't set their own ===
; Active hours (0-23, inclusive — 18 to 4 means 6 PM to 4 AM)
DefaultActiveHourStart = 0
DefaultActiveHourEnd = 23

; CruiseMode: Territory = stay near spawn | GoAway = drive away | Mixed = random
DefaultCruiseMode = Territory
DefaultTerritoryChance = 50
DefaultTerritoryRadius = 150.0

; Blip defaults — overrideable per group below
; BlipSprite: 226 = motorcycle — full list: https://docs.fivem.net/docs/game-references/blips/
DefaultBlipSprite = 226
; BlipColor: 0=white 1=red 2=green 3=blue 25=yellow 27=purple — full list: https://wiki.rage.mp/index.php?title=Blips
DefaultBlipColor = 3
; BlipScale: 0.5=small 0.7=normal 1.0=large
DefaultBlipScale = 0.7

; =============================================================================
; GROUP REFERENCE
; =============================================================================
; Zones = GTA V zone names (empty = spawns everywhere)
;   CHAMH=Chamberlain  DAVIS=Davis    STRAW=Strawberry  RANCHO=Rancho
;   LMESA=La Mesa      CYPRE=Cypress  EBURO=El Burro    MURRI=Murrieta
;   SANDY=Sandy Shores GRAPES=Grapeseed PALETO=Paleto   KOREAT=Little Seoul
;
; BikeModels: comma-separated GTA V motorcycle model names (case-insensitive).
;   ADDON BIKES: use the addon's spawn name like any vanilla bike.
;
;   SPORT/STREET:  BATI, BATI2, AKUMA, CARBONRS, HAKUCHOU, NEMESIS, PCJ, RUFFIAN, LECTRO
;   OFF-ROAD/DIRT: SANCHEZ, SANCHEZ2, BF400, MANCHEZ, ENDURO, CLIFFHANGER, GARGOYLE
;   CRUISER:       DAEMON, HEXER, INNOVATION, WOLFSBANE, ZOMBIEA, ZOMBIEB, RATBIKE, CHIMERA
;   Full list: https://wiki.gtanet.work/index.php/Motorcycles
;
; MixedVehicles: true = each rider gets a different bike (round-robin)
;                false = all riders in the group use the same randomly-picked model
;
; BikeColors: GTA V paint color IDs (empty = random)
;   0=Black 12=Red 27=Blue 38=Green 88=Yellow 120=Purple 135=White
;   Full list: https://wiki.rage.mp/index.php?title=Vehicle_Colors
;
; Weapons: comma-separated weapon names. Leave empty for unarmed riders.
;   WARNING: Armed riders may enter combat with other NPCs, interrupting riding behavior.
;   Common: WEAPON_PISTOL, WEAPON_COMBATPISTOL, WEAPON_APPISTOL, WEAPON_MICROSMG, WEAPON_SMG
;
; DoWheelie: true = riders do wheelies | false = riders just cruise
; DoWheelieStunts: true = riders play trick animations during wheelies
;
; CanFollowPlayer: true = this group can follow the player's vehicle (requires behavior.ini)
;
; RelationshipGroup: GTA V relationship group name (empty = use ped model default)
;   AMBIENT_GANG_FAMILY, AMBIENT_GANG_BALLAS, AMBIENT_GANG_MEXICAN,
;   AMBIENT_GANG_SALVA, AMBIENT_GANG_LOST, AMBIENT_GANG_WEICHENG
;
; PlayerRelationship: Companion | Respect | Like | Neutral | Dislike | Hate | None (default)
;
; CruiseMode: Territory | GoAway | Mixed (overrides the general default for this group)
; =============================================================================

