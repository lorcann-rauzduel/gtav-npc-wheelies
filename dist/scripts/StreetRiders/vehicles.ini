; =============================================================================
; Street Riders v2.0.0 — Vehicles & Wheelie Physics
; =============================================================================
; Controls wheelie physics and per-bike tuning.
; Driving style, stunts and police are in behavior.ini.
; Reload in-game with ReloadKey (default: F10).
; =============================================================================

[General]
; Bike models excluded from wheelie (comma-separated, case-insensitive)
WheelieExcludedModels = BMX, CRUISER, TRIBIKE, TRIBIKE2, TRIBIKE3, SCORCHER, POLICEB

; Bike models with custom wheelie physics (comma-separated).
; For each model listed here, create a [Bike_MODEL] section below.
BikeOverrides = SANCHEZ2, BF400

; =============================================================================
; DEFAULT WHEELIE PHYSICS
; =============================================================================
;
; HOW IT WORKS:
;   Smooth continuous force applied every frame.
;   Force is automatically dampened by pitch velocity,
;   so the bike can't overshoot and oscillate.
;
; PITCH CONTROL:
;   0..50% of TargetPitch  -> full lift force (dampened by rise speed)
;   50%..TargetPitch       -> force fades out progressively + velocity damping
;   TargetPitch..MaxPitch  -> coast zone (no force, gravity settles naturally)
;   Above MaxPitch         -> gentle correction pushes the front back down
;
; TUNING TIPS:
;   - Bike lifts too hard?    Lower LiftForce
;   - Bike doesn't lift?      Raise LiftForce
;   - Wheelie angle too high? Lower TargetPitch
;   - Bike flips over?        Lower MaxPitch
;   - Wheelie still bouncy?   Lower LiftForce and raise TorqueOffset
;
; =============================================================================

[DefaultWheelie]

; --- PHYSICS ---
LiftForce = 0.18
TorqueOffset = 1.2
MinSpeed = 12.0

; --- PITCH ---
TargetPitch = 40.0
MaxPitch = 43.0

; --- TIMING ---
AttemptDurationMin = 3000
AttemptDurationMax = 5000
SustainDurationMin = 5000
SustainDurationMax = 20000
AttemptDelayMin = 1000
AttemptDelayMax = 5000
AttemptsMin = 1
AttemptsMax = 4

; =============================================================================
; DEFAULT WHEELIE PHYSICS — WITH FALL PREVENTION (NoFall)
; =============================================================================
; Applied when fall prevention IS active (PreventFall = Always, or WheelieOnly + chance passed).
; Only settings listed here are overridden — everything else uses [DefaultWheelie].
; Higher values are safe here since the rider won't bail on overshoot.
; [DefaultWheelie] above is the base fallback (also used when fall prevention is off).
; =============================================================================

[DefaultWheelie_NoFall]
LiftForce = 0.35
TargetPitch = 55.0
MaxPitch = 60.0

; =============================================================================
; PER-BIKE OVERRIDES
; =============================================================================
; Only the settings you list here are overridden — everything else uses [DefaultWheelie].
; To add an override: add the model name to BikeOverrides above, then create [Bike_MODEL].
; Also works with addon bikes — use the addon's spawn name.
; =============================================================================

[Bike_SANCHEZ2]
LiftForce = 0.22
TargetPitch = 38.0
MaxPitch = 42.0

; Higher values used when fall prevention IS active for this bike (rider won't bail)
[Bike_SANCHEZ2_NoFall]
LiftForce = 0.50
TargetPitch = 65.0
MaxPitch = 70.0

[Bike_BF400]
LiftForce = 0.15
TargetPitch = 45.0
MaxPitch = 50.0

; Higher values used when fall prevention IS active for this bike (rider won't bail)
[Bike_BF400_NoFall]
LiftForce = 0.28
TargetPitch = 60.0
MaxPitch = 65.0

; --- Add more overrides below ---
; [Bike_X]        = base physics, used when fall prevention is NOT active (or as fallback)
; [Bike_X_NoFall] = optional, aggressive physics used when fall prevention IS active
