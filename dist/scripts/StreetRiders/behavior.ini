; =============================================================================
; Street Riders v2.0.0 — Behavior
; =============================================================================
; Controls driving style, stunts, police, and follow-player.
; Wheelie physics are in vehicles.ini.
; Reload in-game with ReloadKey (default: F10).
; =============================================================================

[Behavior]

; --- STABILITY ---
; PreventFall: controls when riders are protected from being knocked off their bikes.
;   Always      = riders never fall (collisions, obstacles, bullets). Less realistic —
;                 a rider can clip through a wall or car and just keep going.
;   WheelieOnly = protected only during active wheelie (Attempting / Sustained phases).
;                 Allows higher pitch angles to be sustained without the rider bailing.
;                 Outside of wheelies, normal GTA physics apply.
;   Disabled    = default GTA behavior — riders can fall at any time.
PreventFall = Always

; PreventFallChance: probability (0-100) that fall prevention activates for a given wheelie.
;   Only used when PreventFall = WheelieOnly.
;   100 = always protected during wheelies (default)
;    50 = protected half the time — riders occasionally bail, adding variety and realism
;     0 = never protected (equivalent to Disabled)
;
; Use with WheelieOnly for the best balance: riders can reach higher pitch angles when
; protected, but sometimes fall naturally — giving the feel of real skill variation.
PreventFallChance = 100

; --- DRIVING ---
DriveSpeed = 20.0
MaxEntitySpeed = 25.0
DriveAbility = 0.8
DriveAggressiveness = 0.5
; Flags breakdown: AvoidVehicles(4) | SteerAroundStationary(8) | AvoidPeds(16) | AvoidObjects(32)
;   | AdjustCruiseSpeed(16384) | UseShortcutLinks(262144) | ChangeLanes(524288) | Overtake(65536)
; Interactive calculator: https://vespura.com/fivem/drivingstyle/
DrivingFlags = 868413

; --- NATURAL RIDERS ---
; Apply wheelie AI to NPC bikers already in traffic (not just spawned groups)
ApplyToNaturalRiders = false
NaturalRiderScanRadius = 200.0

; --- PED BEHAVIOR ---
BlockNonTempEvents = false
FleeAttributes = 0
CombatAttribute = 5
CombatAttributeValue = false

; --- STUNTS ---
; Cooldown (ms) between stunt animations within the same Sustained wheelie phase
StuntCooldown = 8000
; Stunt animations played during Sustained wheelies.
; Format: dict:clip, dict:clip, ...  (comma-separated)
;
; NOTE: Full-body animations (75% of triggers) replace the rider's driving task for their
; duration. During this window the rider has no active navigation and may collide with
; obstacles — especially walls, poles, and parked cars. A forward raycast (RaycastDistance
; in advanced.ini) tries to cancel stunts before an obstacle is hit, but GTA's collision
; geometry is complex and the raycast won't catch everything. This is a known engine-level
; limitation. Reduce StuntCooldown or increase RaycastDistance to lower the risk.
StuntAnimations = rcmextreme2atv:idle_b, rcmextreme2atv:idle_c, rcmextreme2atv:idle_d, rcmextreme2atv:idle_e

; --- POLICE ---
; AllowPoliceArrest: cops pursue riders actively doing a wheelie (Phase.Sustained only)
AllowPoliceArrest = true
PolicePursuitRadius = 100.0
PolicePursuitMinDuration = 60000

; =============================================================================
; FOLLOW PLAYER
; =============================================================================
; Riders with CanFollowPlayer = true (in groups.ini) can follow your vehicle.
; Toggle manually with ToggleKey, or let it trigger automatically.
; =============================================================================

[FollowPlayer]
Enabled = true
ToggleKey = F7

; Mode: Dynamic  = speed-based (recommended)
;       Proximity = follow when any rider is within FollowRadius
Mode = Dynamic

; Trigger distance (m) — if ANY rider is within this range, group follows
;   40 = close | 60 = normal | 100 = wide
FollowRadius = 100.0

; Cancel distance (m) — group stops following when ALL riders are further than this
LoseRadius = 200.0

; Minimum player speed for Dynamic mode (m/s) — below this, riders take back the lead
DynamicMinSpeed = 12.0

; How long (ms) the player must maintain speed before triggering follow
DynamicTriggerMs = 2000

; What vehicle the player must be in: Any | BikeOnly | TwoWheeler
PlayerVehicleType = Any

; When player dismounts:
;   Wait      = riders dismount, walk to player, play idle scenarios
;   Continue  = random leader takes over the group
;   Freestyle = riders stay on bikes, ride loops and do wheelies near the player
DismountBehavior = Wait

; Idle scenarios riders play when waiting (comma-separated WORLD_HUMAN_* names)
IdleScenarios = WORLD_HUMAN_SMOKING, WORLD_HUMAN_STAND_MOBILE, WORLD_HUMAN_DRUG_DEALER_HARD, WORLD_HUMAN_GUARD_PATROL, WORLD_HUMAN_STAND_IMPATIENT, WORLD_HUMAN_HANG_OUT_STREET

; Delay before riders dismount and start idle scenarios (ms)
IdleDelayMs = 8000

; Delay after player remounts before riders resume following (ms)
ResumeDelayMs = 3000

; Distance from player at which riders start playing idle scenarios (meters)
IdleScenarioDistance = 6.0

; Distance from player at which riders stop scenarios and follow on foot (meters)
IdleFollowDistance = 8.0

; Minimum distance riders keep from the player on foot (meters)
IdleMinStayDistance = 6.0

; Time (ms) a rider waits near the player before starting a scenario
IdleScenarioWaitMs = 4000

; Minimum follow distance (meters) when escorting player on bike
;   10 = tight | 15 = normal | 25 = relaxed
FollowMinDistance = 8

; === Bodyguard Mode (WORK IN PROGRESS — DO NOT ENABLE) ===
; Still under development — may cause riders to attack each other or the player.
BodyguardEnabled = true
BodyguardRadius = 30.0
