; =============================================================================
; Street Riders v2.0.0 — Advanced
; =============================================================================
; Low-level settings — most users never need to touch this.
; Reload in-game with ReloadKey (default: F10).
; =============================================================================

[Advanced]

; --- GROUP ---
; FormationDistance: minimum distance (meters) followers maintain behind the group leader.
;   Too small = followers overtake the leader when it slows down (yo-yo effect).
;   20 = tight | 50 = normal | 80 = spread out
FormationDistance = 50

; LeaderGracePeriodMs: how long (ms) a leader must be missing before a new one is promoted.
;   Prevents rapid leader switching caused by brief ragdolls or short dismounts.
;   4000 = 4s grace (recommended) | 0 = promote immediately (old behavior)
LeaderGracePeriodMs = 4000

; --- SPAWN ---
SpawnDistanceMin = 120.0
SpawnDistanceMax = 150.0
CleanupDistance = 250.0
SpawnIntervalMs = 15000
SpawnSpacing = 5.0

; --- WHEELIE ACTIVATION ---
; Wheelie physics only run when player is within this range (m). Saves performance.
;   50 = close only | 80 = normal | 150 = wide | 200 = max
WheelieActiveDistance = 200.0

; --- DESTINATION ---
DestinationDistanceMin = 300.0
DestinationDistanceMax = 700.0

; --- PHYSICS (low-level) ---
; PulseIntervalMs: 0 = continuous force every frame (recommended)
PulseIntervalMs = 0

; --- SAFETY ---
; RaycastDistance: forward raycast (meters) to detect obstacles before stunt animations
RaycastDistance = 10.0
; MaxSteeringAngle: steering deviation (degrees) above which the wheelie is cancelled
MaxSteeringAngle = 12.0
; BrakeThreshold: brake input (0..1) above which the wheelie is cancelled
BrakeThreshold = 0.5

; --- REMOUNT ---
RemountEnterDistance = 8.0
RemountMaxDistance = 100.0
RemountMoveSpeed = 3.0
RemountTimeout = 15000
RemountTaskCooldown = 3000
RemountForceTimeout = 10000
