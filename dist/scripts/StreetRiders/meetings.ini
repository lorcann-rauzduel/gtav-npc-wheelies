; ============================================================
; Saint Riders — Meetings de motards
; Fichier géré : les lieux [Venue_*] se créent/éditent en jeu
; via le menu MEETINGS (touche MenuKey ci-dessous, F8 par défaut).
; Ne pas éditer la section [Venue_*] à la main sauf migration.
; ============================================================

[Meetings]
; Activer/désactiver les meetings planifiés (forçage manuel via menu possible même éteint)
Enabled = true

; Touche d'ouverture du menu MEETINGS (clé Windows Forms, ex : F8, F7, F6...)
MenuKey = F8

; Jours de la semaine (0=dimanche,1=lundi,...6=samedi) où les lieux se matérialisent
ScheduleDays = 5,0

; Fenêtre horaire quotidienne (supporte le passage de minuit, ex 18 à 2)
StartHour = 18
EndHour = 2

; Distance (m) joueur→lieu déclenchant la matérialisation d'un meeting
MaterializeDistance = 400

; Nombre maximal de meetings simultanés
MaxConcurrentVenues = 1

; Effectif de motards par meeting
RidersMin = 6
RidersMax = 10

; Cadence de changement de rôle à pied (cercle / leaner), en ms
RoleChangeMinMs = 15000
RoleChangeMaxMs = 30000

; Zone de freestyle autour du point de parking (rayon min / max, en mètres)
FreestyleRadiusMin = 40
FreestyleRadius = 80

; Durée d'un burst de freestyle avant de revenir se garer (ms)
FreestyleBurstMinMs = 15000
FreestyleBurstMaxMs = 30000

; Partir en formation à la fin du meeting
DepartureFormation = true

; Les scénarios à pied (fumer/téléphone/boire/...) du cercle sont ceux de
; behavior.ini → [FollowPlayer] → IdleScenarios (réutilisés par le meeting).

; ------------------------------------------------------------------
; Lieux gérés en jeu (menu F8) — sections Venue_<Nom> :
;   Group             = nom du groupe [Group_X] utilisé (groups.ini)
;   ParkingPoint1..24 = x,y,z,cap  (1 point de parking par moto, aligné au cap)
;   CirclePoint1..8   = x,y,z,cap  (points du cercle à pied, orientés vers le centre)
; ------------------------------------------------------------------
[Venue_Venue_1]
Group=Families
ParkingPoint1=-2055.969,-446.9072,11.3808,234.276
[Venue_Venue_2]
Group=Families
ParkingPoint1=-169.435,-1672.943,33.2679,342.5229
