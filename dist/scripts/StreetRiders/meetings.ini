; ============================================================
; Street Riders — Meetings de motards
; Les lieux [Venue_*] se créent et s'éditent en jeu :
;   F8 (MenuKey) > Créer un lieu ici  /  <lieu> > Éditer
; Mode édition (menu fermé, marqueurs au sol) :
;   Entrée = poser · Retour arrière = supprimer le point proche
;   E = outil suivant (Parking / Cercle / Ligne)
;   R = ligne la plus proche : route <-> hors route
;   F8 = quitter l'édition
; ============================================================

[Meetings]
; Activer/désactiver les meetings planifiés (le démarrage manuel via le menu reste possible)
Enabled = true

; Touche d'ouverture du menu MEETINGS (clé Windows Forms, ex : F8, F7, F6...)
MenuKey = F8

; Jours de la semaine (0=dimanche,1=lundi,...6=samedi) où les lieux se matérialisent
ScheduleDays = 5,0

; Fenêtre horaire quotidienne (supporte le passage de minuit, ex 18 à 2)
StartHour = 18
EndHour = 2

; Distance (m) joueur→lieu déclenchant la matérialisation d'un meeting
MaterializeDistance = 400

; Nombre maximal de meetings simultanés
MaxConcurrentVenues = 1

; Effectif de motards par meeting
RidersMin = 6
RidersMax = 10

; Plus de motards que de places : limit = effectif plafonné au nombre de places,
; auto = places générées à la suite de la dernière rangée. Réglable aussi par lieu (menu F8).
ExtraRiders = limit

; Durée d'un rôle (cercle / devant la moto) avant la prochaine décision, en ms
RoleChangeMinMs = 15000
RoleChangeMaxMs = 30000

; Durée d'un passage en freestyle sur une ligne avant de revenir se garer (ms)
FreestyleBurstMinMs = 15000
FreestyleBurstMaxMs = 30000

; Partir en formation à la fin du meeting
DepartureFormation = true

; Les scénarios à pied (fumer/téléphone/boire/...) sont ceux de
; behavior.ini → [FollowPlayer] → IdleScenarios.

; ------------------------------------------------------------------
; Lieux (écrits par l'éditeur en jeu) — sections Venue_<Nom> :
;   Group             = nom du groupe [Group_X] utilisé (groups.ini)
;   Anchor            = x,y,z       (centre du lieu, posé à la création)
;   ParkingPoint1..24 = x,y,z,cap   (une place par moto, alignée au cap)
;   CircleCenter      = x,y,z       (centre du cercle à pied, places générées autour)
;   Line1..8          = ax,ay,az,bx,by,bz,road|offroad  (ligne de freestyle A<->B)
;   RidersMin/Max     = effectif propre au lieu (optionnel, sinon valeurs ci-dessus)
;   ExtraRiders       = limit|auto propre au lieu (optionnel)
; ------------------------------------------------------------------
[Venue_Venue_1]
Group=Families
