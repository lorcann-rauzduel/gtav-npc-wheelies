; =============================================================================
; Street Riders v2.0.0
; =============================================================================
; Reload at any time in-game with ReloadKey (default: F10).
;
; Other files in this folder:
;   groups.ini    — rider groups, zones, spawn hours
;   vehicles.ini  — wheelie physics and per-bike tuning
;   behavior.ini  — driving style, stunts, police, follow-player
;   advanced.ini  — spawn distances, timing (most users never touch this)
; =============================================================================

; =============================================================================
; KEYBINDS — quick reference
; =============================================================================
;   Key              Default     Section           Description
;   ------------------------------------------------------------------
;   ReloadKey        F10         [General]         Reload all config files in-game
;   DebugKey         Insert      [General]         Toggle debug overlay
;   ToggleKey        F7          behavior.ini      Toggle follow-player mode
;   ForceSpawnKey    NumPad1     [TestMode]        Force-spawn a group near player
;   CleanAllKey      NumPad0     [TestMode]        Despawn all active riders
;
; HOW TO CHANGE A KEY:
;   Use the exact name from the .NET Keys enum (case-insensitive).
;   Recommended: F1-F12, NumPad0-NumPad9, Insert, Delete, Home, End, PageUp, PageDown
;   Full list: https://learn.microsoft.com/en-us/dotnet/api/system.windows.forms.keys
;
; CONFLICT WITH ANOTHER MOD?
;   F10 clashes with some trainers — use F9 or a NumPad key instead.
;   NumPad1/0 clash with Menyoo — swap to NumPad7/NumPad8.
; =============================================================================

[General]
Enabled = true
Debug = false

; Show blips on minimap (works even with Debug = false)
ShowBlips = true
; Show overhead text above riders (works even with Debug = false)
ShowOverhead = false

DebugKey = Insert
ReloadKey = F10

; How many groups can be active at the same time
MaxActiveGroups = 1
; Riders per group (min/max — actual count is picked randomly in this range)
RidersPerGroupMin = 2
RidersPerGroupMax = 4

; =============================================================================
; TEST MODE — force spawn / despawn for testing
; =============================================================================

[TestMode]
Enabled = false
ForceSpawnKey = NumPad1
CleanAllKey = NumPad0
